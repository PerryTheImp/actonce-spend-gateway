name: Bug Report
description: Report a bug or unexpected behaviour
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill in the details below.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug in clear terms
      placeholder: |
        When I run `actonce-spend check --amount 100 ...`, it returns approved even though my policy sets max_single_purchase to 50.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the issue
      placeholder: |
        1. Use this policy: [paste YAML]
        2. Run this command: [paste CLI command]
        3. Observe the output
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
      description: What did you expect instead?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Run `node -v && npm -v` and paste the output
      placeholder: |
        Node.js: v20.12.0
        npm: 10.5.0
        OS: macOS 14.4
        Gateway version: 0.1.0
    validations:
      required: false

  - type: textarea
    id: policy
    attributes:
      label: Policy file (if relevant)
      description: Paste the relevant part of your policy YAML
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Any relevant log lines or error messages
      render: shell
    validations:
      required: false