name: Feature Request
description: Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest something. Please be specific.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the gap or pain point
      placeholder: |
        I need to set different spending limits for different OpenClaw agents running on the same machine.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: Describe the feature or behaviour you want
      placeholder: |
        Per-agent policy overrides or agent-specific policy files.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Have you considered alternatives?
      description: What workarounds have you tried?
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: How important is this?
      options:
        - Nice to have
        - Would improve my workflow
        - Blocking my use case
    validations:
      required: false